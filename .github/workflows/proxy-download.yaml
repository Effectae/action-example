name: Download URL Artifact

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "URL to download"
        required: true

jobs:
  download-url:
    runs-on: ubuntu-latest
    env:
      TARGET_URL: ${{ github.event.inputs.target_url }}

    steps:
      - name: Download file with original name
        run: |
          mkdir -p artifacts
          filename=$(basename "$TARGET_URL")
          echo "filename=$filename"
          curl -L --fail --retry 3 -o "artifacts/$filename" "$TARGET_URL"

      - name: Show file details
        run: |
          ls -lh artifacts

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-file
          path: artifacts/*
